name: Sanitize public client secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-sanitize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Remove exposed client-side TURN credential endpoint
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          original = s
          s = re.sub(r'^\s*const\s+METERED_TURN_API_URL\s*=.*?;\s*$', '', s, flags=re.M)
          s = re.sub(r'^\s*let\s+meteredIceServersPromise\s*=\s*null;\s*$', '', s, flags=re.M)
          s = re.sub(
              r'    async function coopLoadIceServers\(\) \{.*?      return meteredIceServersPromise;\n    \}',
              '    async function coopLoadIceServers() {\n      return fallbackIceServers();\n    }',
              s,
              flags=re.S,
          )
          if s != original:
              p.write_text(s, encoding='utf-8')
      - name: Verify current source is clean
        shell: bash
        run: |
          if grep -Eiq 'metered\.live/api/v1/turn/credentials\?apiKey=|METERED_TURN_API_URL|meteredIceServersPromise' index.html; then
            echo 'FAIL: exposed TURN credential reference still present'
            exit 1
          fi
          echo 'PASS: exposed client-side TURN credential reference removed'
      - name: Commit sanitized source if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'SANITIZE_COMMIT=not-needed'
            exit 0
          fi
          git config user.name 'programmer119'
          git config user.email '53187583+programmer119@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove exposed client-side TURN credential'
          git push
