<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuaveForge Games</title>
    <meta name="description" content="SuaveForge game demos and static web games." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <a class="brand" href="https://suaveforge.com">
          <span class="mark" aria-hidden="true"></span>
          <span>SuaveForge Games</span>
        </a>
        <a class="home-link" href="https://suaveforge.com">Main site</a>
      </header>

      <section class="hero">
        <p class="eyebrow">game.suaveforge.com</p>
        <h1>Static game demos live here.</h1>
        <p>
          이 공간은 SuaveForge의 HTML, Canvas, WebGL 기반 게임 데모를 올리는
          정적 페이지입니다. 첫 게임이 준비되면 이 페이지에서 바로 플레이할 수
          있게 연결합니다.
        </p>
      </section>

      <section class="demo-card" aria-label="game placeholder">
        <div class="screen">
          <div class="track"></div>
          <div class="token one"></div>
          <div class="token two"></div>
          <div class="token three"></div>
        </div>
        <div>
          <p class="eyebrow">Coming next</p>
          <h2>Web game showcase</h2>
          <p>
            경마, PVP, 아케이드, 지역 협력 콘텐츠 등 공개 가능한 게임 데모를
            이곳에 순차적으로 올릴 수 있습니다.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
